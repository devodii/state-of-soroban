name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soroban
          POSTGRES_PASSWORD: soroban
          POSTGRES_DB: soroban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soroban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://soroban:soroban@localhost:5432/soroban
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run sqlfluff lint db/schema src/state_of_soroban/sql
      - name: Build the schema on an empty database
        run: uv run state-of-soroban schema apply
      - name: The schema files and the database agree
        run: uv run state-of-soroban schema verify
      - run: uv run pytest
