name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soroban
          POSTGRES_PASSWORD: soroban
          POSTGRES_DB: soroban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soroban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://soroban:soroban@localhost:5432/soroban
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run sqlfluff lint db/schema src/state_of_soroban/sql
      - name: A schema change needs a migration file
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base...HEAD" -- db/schema ':!db/schema/manifest.sql')
          added=$(git diff --name-only --diff-filter=A "$base...HEAD" -- db/migrations)
          if [ -n "$changed" ] && [ -z "$added" ]; then
            echo "::error::The schema files changed but no migration file was added. Run 'state-of-soroban schema plan' and commit the file it writes."
            exit 1
          fi
      - name: Build the schema on an empty database
        run: uv run state-of-soroban schema apply
      - name: The schema files and the database agree
        run: uv run state-of-soroban schema verify
      - run: uv run pytest
      - name: The openapi schema the web app generates its types from is current
        run: |
          uv run state-of-soroban openapi
          git diff --exit-code -- web/openapi.json || {
            echo "::error::The API changed but web/openapi.json did not. Run 'pnpm types' in web and commit the result."
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The generated api types are current
        run: |
          pnpm exec openapi-typescript openapi.json -o src/lib/api-schema.ts --root-types --root-types-no-schema-prefix
          git diff --exit-code -- src/lib/api-schema.ts || {
            echo "::error::web/openapi.json changed but the generated types did not. Run 'pnpm types' and commit the result."
            exit 1
          }
      - run: pnpm format:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
