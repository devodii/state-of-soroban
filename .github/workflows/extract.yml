name: extract

on:
  workflow_dispatch:
    inputs:
      shards:
        description: parallel jobs the queue is split into
        default: "40"
      concurrency:
        description: clones in flight per job
        default: "24"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("shards=" + json.dumps(list(range(int("${{ inputs.shards }}")))))
          PY

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: queue
          path: queue
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Clone and analyse this slice of the queue
        env:
          GITHUB_TOKENS: ${{ github.token }}
        run: |
          uv run state-of-soroban extract-shard \
            --targets queue/targets.txt --patterns queue/patterns.json \
            --index "${{ matrix.shard }}" --count "${{ inputs.shards }}" \
            --out out/shard-${{ matrix.shard }}.jsonl.gz \
            --concurrency "${{ inputs.concurrency }}" 2>&1 | tail -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: extract-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}.jsonl.gz
          retention-days: 3
