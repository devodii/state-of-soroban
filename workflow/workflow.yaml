name: state-of-soroban
summary: Every public soroban contract repo and what it ships, to find what devs rewrite by hand.

window:
  start: 2026-01-01
  end: today

networks: [mainnet, testnet]

catalog:
  patterns: catalog/patterns.yaml
  bug_classes: catalog/bug-classes.yaml
  libraries: catalog/libraries.yaml
  proposals: catalog/proposals.yaml
  tools: catalog/tools.yaml
  needs: catalog/needs.yaml

discover:
  crates_io:
    crates: [soroban-sdk, soroban-token-sdk, stellar-access, stellar-tokens, stellar-macros]
    reverse_dependencies: true
  repository_queries:
    - "topic:soroban"
    - "topic:soroban-contract"
    - "topic:stellar-smart-contracts"
    - "topic:stellar language:Rust"
    - "topic:stellar-soroban"
    - "soroban-sdk in:readme language:Rust"
    - "soroban in:name,description language:Rust"
    - "contractimpl in:readme"
  code_queries:
    - "soroban-sdk filename:Cargo.toml"
    - "soroban-sdk filename:Cargo.toml path:contracts"
    - "contractimpl language:Rust"
    - "contracttype language:Rust"
    - "extern crate soroban_sdk language:Rust"
    - "use soroban_sdk language:Rust"
    - "contractimport language:Rust"
    - "soroban-sdk filename:Cargo.lock"
    - "name = \"soroban-sdk\" filename:Cargo.lock"
    - "soroban-sdk-macros filename:Cargo.lock"
    - "stellar-xdr filename:Cargo.toml"
    - "soroban-client filename:Cargo.toml"
    - "stellar-strkey filename:Cargo.toml"
    - "stellar-rpc-client filename:Cargo.toml"
    - "soroban-env-host filename:Cargo.toml"
    - "soroban-spec filename:Cargo.toml"
    - "#[contract] language:Rust"
    - "#[contracttype] language:Rust"
    - "extend_ttl language:Rust"
  dependents:
    - {repo: stellar/rs-soroban-sdk}
    - {repo: OpenZeppelin/stellar-contracts}
    - {repo: stellar/stellar-cli}
    - {repo: stellar/js-stellar-sdk, packages: ["@stellar/stellar-sdk", "stellar-sdk", "@stellar/stellar-base"]}
  exclude_owners: []
  exclude_repos: []
  min_window_commits: 0

clone:
  shallow_since: "{start}"
  max_repo_kb: 750000
  concurrency: 10
  keep: false
  require_language: Rust
  max_rust_files: 4000
  max_signal_files: 1500
  signal_suffixes: [.rs, .ts, .tsx, .js, .jsx, .mjs, .py, .go, .sh, .toml, .json, .md, .yml, .yaml, .env]
  rust_suffixes: [.rs]
  manifests: [Cargo.toml, Cargo.lock]
  max_file_bytes: 1000000
  skip_directories: [target, node_modules, .git, vendor, test_snapshots]

documents:
  max_text_bytes: 200000
  kinds:
    audit:
      globs: ["audit*/**", "**/audits/**", "**/*audit*.md", "**/*audit*.pdf", "**/security-review*", "**/*report*.pdf"]
    security:
      globs: ["SECURITY.md", "**/SECURITY.md", ".github/SECURITY.md"]
    readme:
      globs: ["README*", "**/README*"]
    changelog:
      globs: ["CHANGELOG*", "**/CHANGELOG*", "RELEASES*"]
    ci:
      globs: [".github/workflows/*.yml", ".github/workflows/*.yaml", ".gitlab-ci.yml", "Makefile", "justfile", "Taskfile.yml"]
    toolchain:
      globs: ["rust-toolchain*", "soroban.json", "stellar.toml", "stellar-cli.toml", ".stellar/**", "deny.toml", "clippy.toml", "rustfmt.toml"]
    docs:
      globs: ["docs/**/*.md", "doc/**/*.md"]
    license:
      globs: ["LICENSE*", "COPYING*"]

history:
  commits: all
  commit_files: true
  issues: all
  releases: true
  contributors: true
  profiles: true
  fix_message: '(?i)\b(fix(es|ed)?|bug(fix)?|patch|hotfix|vuln|vulnerability|exploit|security|cve|overflow|underflow|panic|archiv\w*|expir\w*|ttl|re-?init\w*|auth(oriz|entic)\w*|revert)\b'

networks_signals:
  mainnet:
    - {signal: rpc, regex: 'soroban-rpc\.mainnet|mainnet\.sorobanrpc\.com|rpc\.mainnet|stellar-mainnet|soroban\.stellar\.org'}
    - {signal: horizon, regex: 'horizon\.stellar\.org'}
    - {signal: passphrase, regex: 'Public Global Stellar Network ; September 2015'}
    - {signal: cli, regex: '--network[ =](mainnet|public|pubnet)|NETWORK\s*[:=]\s*[''"]?(mainnet|public|pubnet)'}
    - {signal: sdk, regex: 'Networks\.PUBLIC|Network::Public|StellarNetwork::Mainnet|network_passphrase.*Public'}
  testnet:
    - {signal: rpc, regex: 'soroban-testnet\.stellar\.org|rpc\.testnet|stellar-testnet'}
    - {signal: horizon, regex: 'horizon-testnet\.stellar\.org'}
    - {signal: passphrase, regex: 'Test SDF Network ; September 2015'}
    - {signal: cli, regex: '--network[ =]testnet|NETWORK\s*[:=]\s*[''"]?testnet'}
    - {signal: sdk, regex: 'Networks\.TESTNET|Network::Test|StellarNetwork::Testnet|friendbot'}
  futurenet:
    - {signal: rpc, regex: 'rpc-futurenet\.stellar\.org|horizon-futurenet'}
    - {signal: passphrase, regex: 'Test SDF Future Network ; October 2022'}

chain:
  mainnet:
    rpc_urls:
      - https://mainnet.sorobanrpc.com
      - https://soroban-rpc.mainnet.stellar.gateway.fm
      - https://rpc.lightsail.network
  testnet:
    rpc_urls:
      - https://soroban-testnet.stellar.org
  rpc:
    batch_keys: 200
    concurrency: 4

improve:
  mine:
    min_owners: 5
    min_function_nodes: 14
    max_function_loc: 70
    top_per_kind: 40
    min_macro_owners: 3
    min_term_owners: 8
    min_term_lift: 3.0
    min_topic_repos: 6
    soroban_markers: [storage, instance, persistent, temporary, require_auth, require_auth_for_args, extend_ttl, extend_ttl_for_all, publish, events, invoke_contract, symbol_short, panic_with_error, current_contract_address, ledger, deployer, register, update_current_contract_wasm]
  needs:
    min_relevance: 0.08
    min_issue_rank: 0.3
    min_doc_rank: 0.25
    evidence_per_kind: 40
    min_ngram_owners: 4
    top_mined: 120
    cue_words: [missing, "no way", cannot, "can't", unable, "doesn't work", "does not work", "not working", broken, fails, failing, workaround, "how to", "how do", "would be nice", wish, lack, lacking, limitation, painful, annoying, confusing, unclear, outdated, "hard to", difficult, impossible, "not possible", "not supported", unsupported, "no support", "is there a way", "feature request", "can we", "any plans", "should support", "need a way", "need to be able", "wasting", tedious, boilerplate, manual, manually, "every time", repetitive]
    noise_title: '^(feat|chore|docs|ci|refactor|test|build|style|perf|release|bump|merge)(\(.*\))?!?:'
    weights: {pain: 1.2, owners: 0.5, relevance: 0.6, official: 0.7, custom: 0.7, recency: 0.4, engagement: 0.5, covered: -0.6}
  score:
    recent_days: 90
    weights:
      owners: 1.0
      independence: 0.6
      mainnet: 0.8
      recency: 0.5
      fixes: 0.4
      loc: 0.4
      covered: -0.7
  accept:
    policy: suggest
    min_score: 45
    min_owners: 8
    patterns: auto
    max_mined_patterns: 40
    queries: auto
    min_topic_repos: 15
    min_topic_precision: 0.15

ecosystem:
  batch: 8
  concurrency: 10
  max_text_bytes: 120000
  manifests: [package.json, requirements.txt, pyproject.toml, go.mod, Cargo.toml, composer.json, Gemfile, pubspec.yaml, Package.swift, build.gradle, build.gradle.kts, pom.xml, Pipfile]
  nested_manifests: [package.json, requirements.txt, pyproject.toml, go.mod, Cargo.toml, composer.json]
  subdirs: [frontend, web, app, client, backend, server, api, sdk, cli, packages, apps, contracts, scripts, services, indexer, bot, tools, src]
  files: [README.md, readme.md, Makefile, justfile, Taskfile.yml, Dockerfile, docker-compose.yml, docker-compose.yaml, .env.example, stellar.toml, soroban.json, .tool-versions, CONTRIBUTING.md, SECURITY.md]
  trees: [.github/workflows, scripts, .circleci]
  stellar_terms: 'stellar|soroban|horizon|freighter|albedo|xlm|sep-?\d+|lumens?'

stages:
  - {id: catalog, uses: catalog.sync}
  - {id: discover, uses: github.discover, needs: [catalog]}
  - {id: metadata, uses: github.metadata, needs: [discover]}
  - {id: clone, uses: git.extract, needs: [metadata]}
  - {id: ecosystem, uses: github.ecosystem, needs: [metadata]}
  - {id: history, uses: github.history, needs: [clone]}
  - {id: chain, uses: chain.state, needs: [clone]}
  - {id: dispatch, uses: git.dispatch, needs: [metadata]}
  - {id: harvest, uses: git.harvest, needs: [dispatch]}
  - {id: dependents, uses: github.dependents, needs: [catalog]}
  - {id: sweep, uses: github.sweep, needs: [clone]}
  - {id: mine, uses: catalog.mine, needs: [clone, history, chain]}
  - {id: reanalyse, uses: catalog.reanalyse, needs: [clone]}
  - {id: score, uses: catalog.score, needs: [mine]}
  - {id: qa, uses: qa.stackexchange, needs: [catalog]}
  - {id: needs, uses: catalog.needs, needs: [ecosystem, history, score, qa]}
  - {id: gaps, uses: catalog.gaps, needs: [needs]}
  - {id: graph, uses: graph.build, needs: [score]}
  - {id: report, uses: report.write, needs: [graph, needs]}
