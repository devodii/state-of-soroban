name: state-of-soroban
summary: Every public soroban contract repo and what it ships, to find what devs rewrite by hand.

window:
  start: 2026-01-01
  end: today

networks: [mainnet, testnet]

catalog:
  patterns: catalog/patterns.yaml
  bug_classes: catalog/bug-classes.yaml

discover:
  crates_io:
    crates: [soroban-sdk, soroban-token-sdk, stellar-access, stellar-tokens, stellar-macros]
    reverse_dependencies: true
  repository_queries:
    - "topic:soroban"
    - "topic:soroban-contract"
    - "topic:stellar-smart-contracts"
    - "topic:stellar language:Rust"
    - "topic:stellar-soroban"
    - "soroban-sdk in:readme language:Rust"
    - "soroban in:name,description language:Rust"
    - "contractimpl in:readme"
  code_queries:
    - "soroban-sdk filename:Cargo.toml"
    - "soroban-sdk filename:Cargo.toml path:contracts"
    - "contractimpl language:Rust"
    - "contracttype language:Rust"
    - "extern crate soroban_sdk language:Rust"
    - "use soroban_sdk language:Rust"
    - "contractimport language:Rust"
    - "soroban-sdk filename:Cargo.lock"
    - "name = \"soroban-sdk\" filename:Cargo.lock"
    - "soroban-sdk-macros filename:Cargo.lock"
    - "stellar-xdr filename:Cargo.toml"
    - "soroban-client filename:Cargo.toml"
    - "stellar-strkey filename:Cargo.toml"
    - "stellar-rpc-client filename:Cargo.toml"
    - "soroban-env-host filename:Cargo.toml"
    - "soroban-spec filename:Cargo.toml"
    - "#[contract] language:Rust"
    - "#[contracttype] language:Rust"
    - "extend_ttl language:Rust"
  dependents:
    - {repo: stellar/rs-soroban-sdk}
    - {repo: OpenZeppelin/stellar-contracts}
    - {repo: stellar/stellar-cli}
    - {repo: stellar/js-stellar-sdk, packages: ["@stellar/stellar-sdk", "stellar-sdk", "@stellar/stellar-base"]}
  exclude_owners: []
  exclude_repos: []
  min_window_commits: 0

clone:
  shallow_since: "{start}"
  max_repo_kb: 750000
  concurrency: 24
  keep: false
  keep_test_content: false
  include_forks: false
  require_language: Rust
  max_rust_files: 4000
  max_signal_files: 1500
  signal_suffixes: [.rs, .ts, .tsx, .js, .jsx, .mjs, .py, .go, .sh, .toml, .json, .md, .yml, .yaml, .env]
  rust_suffixes: [.rs]
  manifests: [Cargo.toml, Cargo.lock]
  max_file_bytes: 1000000
  skip_directories: [target, node_modules, .git, vendor, test_snapshots]

expansion:
  fork_pages: 10
  contributor_pages: 3
  min_contributor_repos: 2
  concurrency: 6

documents:
  max_text_bytes: 200000
  kinds:
    audit:
      globs: ["audit*/**", "**/audits/**", "**/*audit*.md", "**/*audit*.pdf", "**/security-review*", "**/*report*.pdf"]
    security:
      globs: ["SECURITY.md", "**/SECURITY.md", ".github/SECURITY.md"]
    readme:
      globs: ["README*", "**/README*"]
    changelog:
      globs: ["CHANGELOG*", "**/CHANGELOG*", "RELEASES*"]
    ci:
      globs: [".github/workflows/*.yml", ".github/workflows/*.yaml", ".gitlab-ci.yml", "Makefile", "justfile", "Taskfile.yml"]
    toolchain:
      globs: ["rust-toolchain*", "soroban.json", "stellar.toml", "stellar-cli.toml", ".stellar/**", "deny.toml", "clippy.toml", "rustfmt.toml"]
    docs:
      globs: ["docs/**/*.md", "doc/**/*.md"]
    license:
      globs: ["LICENSE*", "COPYING*"]

history:
  commits: all
  commit_files: true
  issues: all
  releases: true
  contributors: true
  profiles: true
  fix_message: '(?i)\b(fix(es|ed)?|bug(fix)?|patch|hotfix|vuln|vulnerability|exploit|security|cve|overflow|underflow|panic|archiv\w*|expir\w*|ttl|re-?init\w*|auth(oriz|entic)\w*|revert)\b'

networks_signals:
  mainnet:
    - {signal: rpc, regex: 'soroban-rpc\.mainnet|mainnet\.sorobanrpc\.com|rpc\.mainnet|stellar-mainnet|soroban\.stellar\.org'}
    - {signal: horizon, regex: 'horizon\.stellar\.org'}
    - {signal: passphrase, regex: 'Public Global Stellar Network ; September 2015'}
    - {signal: cli, regex: '--network[ =](mainnet|public|pubnet)|NETWORK\s*[:=]\s*[''"]?(mainnet|public|pubnet)'}
    - {signal: sdk, regex: 'Networks\.PUBLIC|Network::Public|StellarNetwork::Mainnet|network_passphrase.*Public'}
  testnet:
    - {signal: rpc, regex: 'soroban-testnet\.stellar\.org|rpc\.testnet|stellar-testnet'}
    - {signal: horizon, regex: 'horizon-testnet\.stellar\.org'}
    - {signal: passphrase, regex: 'Test SDF Network ; September 2015'}
    - {signal: cli, regex: '--network[ =]testnet|NETWORK\s*[:=]\s*[''"]?testnet'}
    - {signal: sdk, regex: 'Networks\.TESTNET|Network::Test|StellarNetwork::Testnet|friendbot'}
  futurenet:
    - {signal: rpc, regex: 'rpc-futurenet\.stellar\.org|horizon-futurenet'}
    - {signal: passphrase, regex: 'Test SDF Future Network ; October 2022'}

autopilot:
  followed:
    metadata: metadata
    history: history
  periodic: [expand, sweep, dispatch, harvest]
  periodic_seconds: 600
  discovery_seconds: 3600
  dependents_seconds: 21600
  pool_size: 40
  min_free_gb: 3
  download_concurrency: 12
  stats_seconds: 300

readiness:
  min_recall: 0.99
  quiet_hours: 24
  max_new_soroban_in_quiet: 0
  min_known_rediscovered: 0.99
  known_file: seeds/known-soroban-repos.txt

stages:
  - {id: catalog, uses: catalog.sync}
  - {id: discover, uses: github.discover, needs: [catalog]}
  - {id: dependents, uses: github.dependents, needs: [catalog]}
  - {id: metadata, uses: github.metadata, needs: [discover]}
  - {id: clone, uses: git.extract, needs: [metadata]}
  - {id: dispatch, uses: git.dispatch, needs: [metadata]}
  - {id: harvest, uses: git.harvest, needs: [dispatch]}
  - {id: history, uses: github.history, needs: [harvest]}
  - {id: expand, uses: github.expand, needs: [metadata]}
  - {id: sweep, uses: github.sweep, needs: [harvest]}
