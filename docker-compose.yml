name: state-of-soroban

x-indexer: &indexer
  build: .
  working_dir: /app
  volumes:
    - ./:/app
    - indexer-venv:/app/.venv
    - clones:/clones
  environment:
    UV_LINK_MODE: copy
    DATABASE_URL: postgresql://soroban:soroban@db:5432/soroban
    GITHUB_TOKENS: ${GITHUB_TOKENS:-}
    MAINNET_RPC_URL: ${MAINNET_RPC_URL:-https://mainnet.sorobanrpc.com}
    WORKFLOW_FILE: ${WORKFLOW_FILE:-/app/workflow/workflow.yaml}
    CLONE_DIR: /clones
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=768MB
      - -c
      - synchronous_commit=off
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_connections=200
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - autovacuum_max_workers=4
    environment:
      POSTGRES_USER: soroban
      POSTGRES_PASSWORD: soroban
      POSTGRES_DB: soroban
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5443}:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  indexer:
    <<: *indexer
    profiles: [tools]
    entrypoint: ["uv", "run", "state-of-soroban"]

volumes:
  indexer-venv:
  clones:
