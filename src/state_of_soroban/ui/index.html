<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State of Soroban</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#262d36; --text:#e6edf3; --muted:#8b949e; --brand:#7c9cff; --good:#3fb950; --warn:#d29922; --bad:#f85149; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --panel:#fff; --line:#d8dee4; --text:#1f2328; --muted:#656d76; --brand:#3b5bdb; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:0; color:var(--muted); padding:6px 10px; border-radius:6px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--panel); color:var(--text); }
  .spacer { flex:1; }
  .pill { font-size:12px; color:var(--muted); }
  main { padding:20px; max-width:1500px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .card span { color:var(--muted); font-size:12px; }
  .bar { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  input[type=search], input[type=text], textarea { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--text); font:inherit; }
  input[type=search] { width:320px; max-width:100%; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0; background:var(--panel); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:hover td { background:color-mix(in srgb, var(--brand) 6%, transparent); }
  tr.click { cursor:pointer; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); margin-right:4px; }
  .mainnet { color:var(--good); border-color:var(--good); } .testnet { color:var(--warn); border-color:var(--warn); }
  .ok { color:var(--good); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  .scroll { max-height:70vh; overflow:auto; border-radius:10px; }
  #graph { height:68vh; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  aside { position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); background:var(--panel); border-left:1px solid var(--line); padding:18px; overflow:auto; transform:translateX(100%); transition:transform .18s; z-index:10; }
  aside.open { transform:none; }
  .comment { border-top:1px solid var(--line); padding:8px 0; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  textarea { width:100%; min-height:70px; }
  button.primary { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:7px 14px; cursor:pointer; font:inherit; }
  code { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>State of Soroban</h1>
  <nav id="tabs"></nav>
  <span class="spacer"></span>
  <a class="pill" href="/report" target="_blank">report</a>
  <label class="pill"><input type="checkbox" id="auto" checked> live</label>
  <span class="pill" id="stamp"></span>
</header>
<main id="view"></main>
<aside id="drawer"></aside>
<script src="https://unpkg.com/force-graph@1.43.5/dist/force-graph.min.js"></script>
<script>
const TABS = ['overview','repos','patterns','proposals','needs','candidates','chain','discovery','graph'];
const state = { tab: location.hash.slice(1) || 'overview', data: null, sort: {}, filter: '' };
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n) => n == null ? '' : Number(n).toLocaleString();
const day = (v) => v ? String(v).slice(0, 10) : '';

function renderTabs() {
  $('#tabs').innerHTML = TABS.map((t) => `<button class="${t===state.tab?'on':''}" data-tab="${t}">${t}</button>`).join('');
}
function table(id, columns, rows, onClick) {
  const sort = state.sort[id];
  let list = rows.filter((r) => !state.filter || JSON.stringify(r).toLowerCase().includes(state.filter));
  if (sort) list = [...list].sort((a, b) => (a[sort.key] > b[sort.key] ? 1 : a[sort.key] < b[sort.key] ? -1 : 0) * sort.dir);
  const head = columns.map((c) => `<th class="${c.num?'num':''}" data-sort="${id}:${c.key}">${c.label}${sort?.key===c.key?(sort.dir>0?' ▲':' ▼'):''}</th>`).join('');
  const body = list.map((r, i) => `<tr class="${onClick?'click':''}" data-row="${id}:${i}">${columns.map((c) => `<td class="${c.num?'num':''}">${c.render?c.render(r):esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  state.rows = { ...(state.rows||{}), [id]: list };
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td class="empty" colspan="${columns.length}">nothing here yet</td></tr>`}</tbody></table></div>`;
}
const search = (ph) => `<div class="bar"><input type="search" id="q" placeholder="${ph}" value="${esc(state.filter)}"></div>`;
const nets = (r) => (r.networks||[]).map((n) => `<span class="badge ${n}">${n}</span>`).join('');

const VIEWS = {
  overview(d) {
    const c = d.counts, labels = {repos:'repos found', soroban_repos:'soroban repos', cloned:'cloned', with_metadata:'with metadata', functions:'functions parsed', pattern_matches:'pattern matches', commits:'commits', fix_commits:'fix commits', issues:'issues + PRs', contracts:'contracts on chain', wasm_modules:'wasm modules', open_candidates:'open candidates'};
    const cards = Object.entries(labels).map(([k, l]) => `<div class="card"><b>${fmt(c[k])}</b><span>${l}</span></div>`).join('');
    const net = d.networks.map((n) => `<div class="card"><b>${fmt(n.contracts)}</b><span><span class="badge ${n.network}">${n.network}</span>${fmt(n.live)} live</span></div>`).join('');
    const stages = table('stages', [
      {key:'stage',label:'stage'}, {key:'status',label:'status',render:(r)=>`<span class="${r.status==='done'?'ok':r.status==='failed'?'bad':'muted'}">${esc(r.status)}</span>`},
      {key:'items',label:'items',num:1,render:(r)=>fmt(r.items)}, {key:'errors',label:'errors',num:1}, {key:'seconds',label:'seconds',num:1,render:(r)=>Number(r.seconds).toFixed(1)}, {key:'started_at',label:'started',render:(r)=>esc(String(r.started_at).slice(0,19))}], d.stages);
    const rc = d.recall || {};
    const recall = `<div class="cards"><div class="card"><b>${fmt(rc.confirmed)}</b><span>confirmed soroban repos</span></div><div class="card"><b>${fmt(rc.by_text)}</b><span>found by text search</span></div><div class="card"><b>${fmt(rc.by_content)}</b><span>found by content search</span></div><div class="card"><b>${fmt(rc.by_both)}</b><span>found by both</span></div><div class="card"><b>${rc.estimated_total == null ? 'n/a' : fmt(rc.estimated_total)}</b><span>estimated true total</span></div><div class="card"><b>${rc.estimated_missing == null ? 'n/a' : fmt(rc.estimated_missing)}</b><span>estimated still missing</span></div><div class="card"><b>${fmt(rc.saturated_slices)}</b><span>search slices that hit GitHub's 1,000 cap</span></div></div><p class="muted">Coverage check: ${esc(rc.note || '')}</p>`;
    return `<div class="cards">${cards}${net}</div><h3>Discovery coverage</h3>${recall}<h3>Stage runs</h3>${stages}`;
  },
  repos(d) {
    return search('filter repos…') + table('repos', [
      {key:'full_name',label:'repo',render:(r)=>`<a href="https://github.com/${esc(r.full_name)}" target="_blank" onclick="event.stopPropagation()">${esc(r.full_name)}</a>`},
      {key:'is_soroban',label:'soroban',render:(r)=>r.is_soroban?'<span class="ok">yes</span>':'<span class="muted">no</span>'},
      {key:'networks',label:'network',render:nets}, {key:'stars',label:'★',num:1}, {key:'window_commits',label:'commits',num:1},
      {key:'rust_loc',label:'rust loc',num:1,render:(r)=>fmt(r.rust_loc)}, {key:'contract_crates',label:'contracts',num:1}, {key:'pattern_hits',label:'pattern hits',num:1},
      {key:'sources',label:'found by',num:1}, {key:'pushed_at',label:'pushed',render:(r)=>day(r.pushed_at)}, {key:'comments',label:'💬',num:1}], d.repos, true);
  },
  patterns(d) {
    return search('filter patterns…') + table('patterns', [{key:'id',label:'pattern'},{key:'category',label:'category'},{key:'repos',label:'repos',num:1},{key:'occurrences',label:'occurrences',num:1,render:(r)=>fmt(r.occurrences)},{key:'description',label:'what it is'}], d.patterns);
  },
  proposals(d) {
    const m = (r) => (r.evidence || {}).metrics || {};
    const ind = (r) => r.evidence && r.evidence.copy_share != null ? Math.round((1 - r.evidence.copy_share) * 100) + '%' : '';
    return `<p class="muted">Every proposal is scored by the same reuse formula. <b>seed</b> = a hypothesis from the catalog, <b>mined</b> = found in the code by the miner. Click a row for the evidence.</p>` + search('filter proposals…') + table('proposals', [
      {key:'score',label:'score',num:1,render:(r)=>`<b>${Number(r.score).toFixed(1)}</b>`},
      {key:'name',label:'proposal'},
      {key:'origin',label:'origin',render:(r)=>`<span class="badge">${esc(r.origin)}</span>`},
      {key:'status',label:'status',render:(r)=>`<span class="${['supported','strong','accepted'].includes(r.status)?'ok':r.status==='unsupported'?'bad':'muted'}">${esc(r.status)}</span>`},
      {key:'o',label:'owners',num:1,render:(r)=>fmt(m(r).owners)},
      {key:'r',label:'repos',num:1,render:(r)=>fmt(m(r).repos)},
      {key:'occ',label:'times written',num:1,render:(r)=>fmt(m(r).occurrences)},
      {key:'ind',label:'written independently',num:1,render:ind},
      {key:'mn',label:'mainnet repos',num:1,render:(r)=>fmt(m(r).mainnet_repos)},
      {key:'fx',label:'fixes + bug issues',num:1,render:(r)=>fmt((m(r).fix_commits||0)+(m(r).bug_issues||0))},
      {key:'loc',label:'lines',num:1,render:(r)=>fmt(m(r).loc_total)},
      {key:'comments',label:'💬',num:1}], d.proposals, true);
  },
  needs(d) {
    const dm = (r) => r.demand || {};
    return `<p class="muted">Tooling the Stellar ecosystem seems to need, for RFPs. <b>pain</b> = issues that voice it as a problem or request, <b>on their own</b> = repos that already carry their own implementation. Each signal is ranked against the other needs. Click a row for the RFP draft and evidence.</p>` + search('filter needs…') + table('needs', [
      {key:'score',label:'score',num:1,render:(r)=>`<b>${Number(r.score).toFixed(1)}</b>`},
      {key:'title',label:'need'}, {key:'category',label:'category'},
      {key:'origin',label:'origin',render:(r)=>`<span class="badge">${esc(r.origin)}</span>`},
      {key:'pain',label:'pain issues',num:1,render:(r)=>fmt(dm(r).pain_issues)}, {key:'pown',label:'owners in pain',num:1,render:(r)=>fmt(dm(r).pain_owners)},
      {key:'topical',label:'topical issues',num:1,render:(r)=>fmt(dm(r).issues)}, {key:'docs',label:'docs',num:1,render:(r)=>fmt(dm(r).documents)},
      {key:'custom',label:'on their own',num:1,render:(r)=>fmt(dm(r).custom_repos)}, {key:'official',label:'official repos',num:1,render:(r)=>fmt(dm(r).official)},
      {key:'tools',label:'partly served by',render:(r)=>esc(r.tools || '')}, {key:'comments',label:'💬',num:1}], d.needs, true);
  },
  candidates(d) {
    return `<p class="muted">What the miner found in the corpus that the catalog does not cover yet.</p>` + search('filter candidates…') + table('candidates', [{key:'kind',label:'kind'},{key:'title',label:'candidate'},{key:'repos',label:'repos',num:1},{key:'occurrences',label:'occurrences',num:1},{key:'score',label:'score',num:1,render:(r)=>Number(r.score).toFixed(1)},{key:'status',label:'status'}], d.candidates);
  },
  chain(d) {
    const short = (v) => v ? `<code>${esc(v.slice(0, 6))}…${esc(v.slice(-4))}</code>` : '';
    const net = (r) => `<span class="badge ${r.network}">${esc(r.network)}</span>`;
    return `<p class="muted">Summarised from the public ledger archive (full days only). Busiest contracts first.</p><h3>Busiest contracts</h3>` + table('contracts', [
      {key:'network',label:'network',render:net}, {key:'contract_id',label:'contract',render:(r)=>`<a target="_blank" href="https://stellar.expert/explorer/${r.network==='mainnet'?'public':'testnet'}/contract/${esc(r.contract_id)}">${short(r.contract_id)}</a>`},
      {key:'invocations',label:'calls',num:1,render:(r)=>fmt(r.invocations)}, {key:'successful',label:'succeeded',num:1,render:(r)=>fmt(r.successful)},
      {key:'peak_daily_callers',label:'peak daily callers',num:1,render:(r)=>fmt(r.peak_daily_callers)}, {key:'active_days',label:'active days',num:1},
      {key:'first_day',label:'first seen',render:(r)=>day(r.first_day)}, {key:'repos',label:'repo that references it'}], d.top_contracts)
      + `<h3>Who calls whom</h3>` + table('edges', [{key:'network',label:'network',render:net},{key:'caller',label:'caller',render:(r)=>short(r.caller)},{key:'callee',label:'callee',render:(r)=>short(r.callee)},{key:'calls',label:'calls',num:1,render:(r)=>fmt(r.calls)},{key:'active_days',label:'days',num:1}], d.top_edges)
      + `<h3>Network totals per day</h3>` + table('netdays', [{key:'day',label:'day',render:(r)=>day(r.day)},{key:'network',label:'network',render:net},{key:'ledgers',label:'ledgers',num:1,render:(r)=>fmt(r.ledgers)},{key:'transactions',label:'transactions',num:1,render:(r)=>fmt(r.transactions)},{key:'failed_transactions',label:'failed',num:1,render:(r)=>fmt(r.failed_transactions)},{key:'contract_calls',label:'contract calls',num:1,render:(r)=>fmt(r.contract_calls)},{key:'contracts_called',label:'distinct contracts called',num:1,render:(r)=>fmt(r.contracts_called)}], d.network_days);
  },
  discovery(d) {
    return `<p class="muted">How well each search query finds soroban repos, so the workflow can retire the weak ones.</p>` + table('queries', [{key:'kind',label:'kind'},{key:'query',label:'query',render:(r)=>`<code>${esc(r.query)}</code>`},{key:'hits',label:'hits',num:1},{key:'new_repos',label:'new',num:1},{key:'soroban_repos',label:'soroban',num:1},{key:'seconds',label:'sec',num:1,render:(r)=>Number(r.seconds).toFixed(0)}], d.queries);
  },
  graph() { return `<div id="graphbar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px"></div><div id="legend" style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px" class="muted"></div><div id="graph"><div class="empty">loading graph…</div></div><p class="muted" id="graphnote"></p>`; },
};

async function draw() {
  renderTabs();
  if (!state.data) return;
  const keepFocus = document.activeElement?.id === 'q';
  $('#view').innerHTML = VIEWS[state.tab](state.data);
  const q = $('#q'); if (q) { q.oninput = (e) => { state.filter = e.target.value.toLowerCase(); draw(); }; if (keepFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  if (state.tab === 'graph') drawGraph();
}
async function load() {
  try {
    state.data = await (await fetch('/api/overview')).json();
    $('#stamp').textContent = 'updated ' + new Date().toLocaleTimeString();
    if (state.tab !== 'graph' || !state.graphShown) draw();
  } catch (e) { $('#stamp').textContent = 'offline'; }
}
const KIND = {
  proposal: { color: '#f0883e', label: 'proposal', hint: 'something we could build, size = score' },
  repo: { color: '#7c9cff', label: 'repo', hint: 'writes it by hand, size = stars' },
  bug_class: { color: '#f85149', label: 'bug class', hint: 'what the proposal would prevent' },
  library: { color: '#a371f7', label: 'library', hint: 'already covers a proposal' },
  contract: { color: '#2dd4bf', label: 'contract', hint: 'deployed on chain' },
};
const EDGE = {
  hand_rolls: ['#8b949e', 'repo writes it by hand'], prevents: ['#f85149', 'proposal prevents this bug'],
  covered_by: ['#a371f7', 'a library already solves it'], uses_library: ['#a371f7', 'repo uses the library'],
  deploys: ['#2dd4bf', 'repo deploys the contract'], calls: ['#2dd4bf', 'contract calls contract'],
};
const gstate = { raw: null, focus: null, kinds: new Set(['proposal','repo','bug_class','library','contract']), selected: null, query: '', graph: null };
function buildView() {
  const { nodes, edges } = gstate.raw;
  let keepNodes = new Set(nodes.map((n) => n.id)), note = '';
  if (gstate.focus) {
    const f = gstate.focus, near = new Set([f]);
    edges.forEach((e) => { if (e.src === f) near.add(e.dst); if (e.dst === f) near.add(e.src); });
    const repos = [...near].filter((id) => id.startsWith('repo:')).map((id) => gstate.byId[id]).sort((a, b) => ((b.props || {}).weight || 0) - ((a.props || {}).weight || 0));
    const shown = new Set(repos.slice(0, 150).map((n) => n.id));
    const total = repos.length;
    keepNodes = new Set([f, ...[...near].filter((id) => !id.startsWith('repo:')), ...shown]);
    edges.forEach((e) => { if (shown.has(e.src) && gstate.byId[e.dst] && gstate.byId[e.dst].kind === 'library') keepNodes.add(e.dst); });
    note = `Showing the ${shown.size} biggest of ${total} repos that write "${gstate.byId[f].label}" by hand.`;
  } else { note = 'Everything at once. Pick a proposal above to focus, this view is dense on purpose.'; }
  const nodeList = nodes.filter((n) => keepNodes.has(n.id) && gstate.kinds.has(n.kind));
  const ids = new Set(nodeList.map((n) => n.id));
  const links = edges.filter((e) => ids.has(e.src) && ids.has(e.dst)).map((e) => ({ source: e.src, target: e.dst, kind: e.kind, value: Number(e.weight) }));
  $('#graphnote').textContent = note + ` ${nodeList.length} nodes, ${links.length} links.`;
  const ranked = nodeList.filter((n) => n.kind === 'repo').sort((a, b) => ((b.props || {}).weight || 0) - ((a.props || {}).weight || 0));
  const rank = Object.fromEntries(ranked.map((n, i) => [n.id, i]));
  return { nodes: nodeList.map((n) => ({ ...n, rank: rank[n.id] })), links };
}
function neighbours(id, links) {
  const set = new Set([id]);
  links.forEach((l) => { const s = l.source.id ?? l.source, t = l.target.id ?? l.target; if (s === id) set.add(t); if (t === id) set.add(s); });
  return set;
}
function paintGraph() {
  const data = buildView(), el = $('#graph'); el.innerHTML = '';
  const q = gstate.query.trim().toLowerCase();
  let near = null;
  const g = ForceGraph()(el).width(el.clientWidth).height(el.clientHeight).graphData(data).backgroundColor('#0d1117')
    .nodeRelSize(1).cooldownTicks(120).d3VelocityDecay(0.3)
    .nodeVal((n) => { const w = (n.props || {}).weight || 1; return n.kind === 'proposal' ? 30 + w : n.kind === 'repo' ? 3 + w * 1.5 : 36; })
    .nodeLabel((n) => `<b>${n.label}</b><br>${KIND[n.kind].label}${n.kind === 'proposal' ? ' · score ' + Number((n.props || {}).score).toFixed(1) : ''}${n.kind === 'repo' ? ' · ★ ' + ((n.props || {}).stars ?? '') : ''}`)
    .linkColor((l) => { const lit = !near || (near.has(l.source.id) && near.has(l.target.id)); return lit ? (EDGE[l.kind] || ['#8b949e'])[0] + (near ? 'cc' : '55') : '#ffffff08'; })
    .linkWidth((l) => (near ? 1.4 : 0.6)).linkDirectionalArrowLength((l) => (l.kind === 'hand_rolls' ? 0 : 3)).linkDirectionalArrowRelPos(1)
    .nodeCanvasObject((n, ctx, scale) => {
      const r = Math.sqrt(n.kind === 'proposal' ? 30 + ((n.props || {}).weight || 1) : n.kind === 'repo' ? 3 + ((n.props || {}).weight || 1) * 1.5 : 36);
      const matches = q && n.label.toLowerCase().includes(q);
      const dim = (near && !near.has(n.id)) || (q && !matches && n.kind === 'repo');
      ctx.globalAlpha = dim ? 0.12 : 1; ctx.fillStyle = KIND[n.kind].color; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI); ctx.fill();
      if (gstate.selected === n.id || gstate.hover === n.id) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 / scale; ctx.stroke(); }
      const big = n.kind !== 'repo';
      const label = big || matches || gstate.hover === n.id || gstate.selected === n.id || (near && near.has(n.id) && near.size < 40) || (n.rank != null && n.rank < 8 && scale > 1.2);
      if (label && !dim) {
        const size = (big ? 13 : 11) / scale, text = n.label.length > 42 ? n.label.slice(0, 40) + '…' : n.label;
        ctx.font = `${big ? 600 : 400} ${size}px sans-serif`; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
        ctx.lineWidth = 3 / scale; ctx.strokeStyle = '#0d1117'; ctx.strokeText(text, n.x, n.y + r + 12 / scale);
        ctx.fillStyle = '#e6edf3'; ctx.fillText(text, n.x, n.y + r + 12 / scale);
      }
      ctx.globalAlpha = 1;
    })
    .nodePointerAreaPaint((n, color, ctx) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(n.x, n.y, 8, 0, 2 * Math.PI); ctx.fill(); })
    .onNodeHover((n) => { gstate.hover = n ? n.id : null; el.style.cursor = n ? 'pointer' : 'default'; })
    .onNodeClick((n) => {
      gstate.selected = n.id; near = neighbours(n.id, data.links); g.linkColor(g.linkColor());
      if (n.kind === 'repo') openRepo(n.label);
      else if (n.kind === 'proposal') { const pr = (state.data.proposals || []).find((p) => 'proposal:' + p.id === n.id); if (pr) openProposal(pr); }
      else if (n.kind === 'contract') window.open('https://stellar.expert/explorer/' + ((n.props || {}).network === 'mainnet' ? 'public' : 'testnet') + '/contract/' + n.id.split(':')[2], '_blank');
    })
    .onBackgroundClick(() => { gstate.selected = null; near = null; g.linkColor(g.linkColor()); });
  g.d3Force('charge').strength(-45); g.d3Force('link').distance((l) => (l.kind === 'hand_rolls' ? 70 : 90));
  gstate.graph = g;
  if (q) { const hit = data.nodes.find((n) => n.label.toLowerCase().includes(q)); if (hit) setTimeout(() => g.centerAt(hit.x, hit.y, 600).zoom(4, 600), 700); }
  else setTimeout(() => g.zoomToFit(400, 60), 900);
}
async function drawGraph() {
  const g = await (await fetch('/api/graph')).json();
  const el = $('#graph');
  if (!g.nodes.length) { el.innerHTML = '<div class="empty">The graph is built by the graph stage once repos, calls and chain data are in.</div>'; return; }
  gstate.raw = g; gstate.byId = Object.fromEntries(g.nodes.map((n) => [n.id, n]));
  if (gstate.focus === null && !gstate.touched) { const top = g.nodes.filter((n) => n.kind === 'proposal').sort((a, b) => b.props.score - a.props.score)[0]; gstate.focus = top ? top.id : null; }
  const proposals = g.nodes.filter((n) => n.kind === 'proposal').sort((a, b) => b.props.score - a.props.score);
  $('#graphbar').innerHTML = `<label class="pill">Focus on <select id="gfocus" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;max-width:420px"><option value="">everything (dense)</option>${proposals.map((p) => `<option value="${esc(p.id)}" ${p.id === gstate.focus ? 'selected' : ''}>${esc(p.label)} (${Number(p.props.score).toFixed(0)})</option>`).join('')}</select></label>
    <input type="search" id="gsearch" placeholder="find a repo or node…" value="${esc(gstate.query)}" style="width:240px">
    ${Object.entries(KIND).map(([k, v]) => `<label class="pill"><input type="checkbox" data-kind="${k}" ${gstate.kinds.has(k) ? 'checked' : ''}> ${v.label}</label>`).join('')}
    <button id="greset">reset view</button>`;
  $('#legend').innerHTML = Object.values(KIND).map((v) => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${v.color};margin-right:6px"></span><b>${v.label}</b>: ${v.hint}</span>`).join('') + '<span>lines: repo → proposal means "writes it by hand", proposal → red means "prevents this bug"</span>';
  $('#gfocus').onchange = (e) => { gstate.focus = e.target.value || null; gstate.touched = true; paintGraph(); };
  $('#gsearch').oninput = (e) => { gstate.query = e.target.value; clearTimeout(gstate.t); gstate.t = setTimeout(paintGraph, 300); };
  document.querySelectorAll('[data-kind]').forEach((c) => (c.onchange = () => { c.checked ? gstate.kinds.add(c.dataset.kind) : gstate.kinds.delete(c.dataset.kind); paintGraph(); }));
  $('#greset').onclick = () => { gstate.query = ''; gstate.selected = null; gstate.kinds = new Set(Object.keys(KIND)); drawGraph(); };
  state.graphShown = true; paintGraph();
}
async function openNeed(n) {
  const rows = await (await fetch('/api/comments?target_kind=need&target_id=' + encodeURIComponent(n.id))).json();
  const rfp = n.rfp || {}, ev = n.evidence || {}, comp = ev.components || {};
  const bars = Object.keys(comp).map((k) => `<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><span style="width:110px" class="muted">${k}</span><div style="flex:1;background:var(--line);border-radius:4px;height:8px"><div style="width:${Math.round(comp[k]*100)}%;height:8px;border-radius:4px;background:${k==='covered'?'var(--bad)':'var(--brand)'}"></div></div><span style="width:44px;text-align:right">${(comp[k]*100).toFixed(0)}%</span></div>`).join('');
  const list = (a) => (a || []).map((x) => '<li>' + esc(x) + '</li>').join('');
  const d = $('#drawer'); d.classList.add('open');
  d.innerHTML = `<button onclick="document.querySelector('#drawer').classList.remove('open')">close</button>
    <h3>${esc(n.title)}</h3><p><span class="badge">${esc(n.category)}</span> <span class="badge">${esc(n.origin)}</span> <span class="badge">${esc(rfp.priority || '')} priority</span> <b>score ${Number(n.score).toFixed(1)}</b></p>
    <h4>Problem</h4><p>${esc(rfp.problem || n.summary)}</p>
    <h4>Gap</h4><p>${esc(rfp.gap || '')}</p>
    ${(rfp.existing_tools || []).length ? '<h4>Existing tools</h4><ul>' + rfp.existing_tools.map((t) => '<li>' + (t.url ? '<a target="_blank" href="' + esc(t.url) + '">' + esc(t.name) + '</a>' : esc(t.name)) + ' <span class="muted">(' + esc(t.relation) + ')</span></li>').join('') + '</ul>' : ''}
    ${(rfp.who_is_affected || []).length ? '<h4>Who is affected (by stack)</h4><p>' + rfp.who_is_affected.map((s) => esc(s.stack) + ' <span class="muted">' + s.repos + '</span>').join(' · ') + '</p>' : ''}
    ${(rfp.deliverables || []).length ? '<h4>Proposed deliverables</h4><ul>' + list(rfp.deliverables) + '</ul>' : ''}
    ${(rfp.success_metrics || []).length ? '<h4>Success looks like</h4><ul>' + list(rfp.success_metrics) + '</ul>' : ''}
    <h4>Why it scores this</h4>${bars}
    <h4>Evidence, most relevant first</h4>${(rfp.evidence_highlights || []).map((e) => `<div class="comment"><a target="_blank" href="${esc(e.url)}">${esc(e.repo)}</a> <span class="badge">${esc(e.kind)}</span> <span class="muted">relevance ${e.relevance}</span><br><b>${esc(e.title)}</b><br><span class="muted">${(e.snippet || '').replace(/<(?!\/?b>)[^>]*>/g, '')}</span></div>`).join('') || '<div class="muted">no evidence yet</div>'}
    <h4>Notes</h4><div>${rows.map((c) => `<div class="comment"><b>${esc(c.author)}</b> <span class="muted">${esc(String(c.created_at).slice(0,16))}</span><br>${esc(c.body)}</div>`).join('') || '<div class="muted">no notes yet</div>'}</div>
    <p><input type="text" id="who" placeholder="your name" value="${esc(localStorage.getItem('who')||'')}" style="width:100%;margin-bottom:6px"><textarea id="note" placeholder="leave a note on this need"></textarea></p>
    <button class="primary" id="send">Add note</button>`;
  $('#send').onclick = async () => {
    const author = $('#who').value || 'anonymous'; localStorage.setItem('who', author);
    const body = $('#note').value.trim(); if (!body) return;
    await fetch('/api/comments', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ target_kind:'need', target_id:n.id, author, body }) });
    openNeed(n); load();
  };
}
async function openProposal(p) {
  const rows = await (await fetch('/api/comments?target_kind=proposal&target_id=' + encodeURIComponent(p.id))).json();
  const ev = p.evidence || {}, mt = ev.metrics || {}, comp = ev.components || {}, w = ev.weighted || {}, sm = ev.sample || {};
  const bars = Object.keys(comp).map((k) => `<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><span style="width:110px" class="muted">${k}</span><div style="flex:1;background:var(--line);border-radius:4px;height:8px"><div style="width:${Math.round(comp[k]*100)}%;height:8px;border-radius:4px;background:${(w[k]||0)<0?'var(--bad)':'var(--brand)'}"></div></div><span style="width:44px;text-align:right">${(comp[k]*100).toFixed(0)}%</span></div>`).join('');
  const d = $('#drawer'); d.classList.add('open');
  d.innerHTML = `<button onclick="document.querySelector('#drawer').classList.remove('open')">close</button>
    <h3>${esc(p.name)}</h3><p><span class="badge">${esc(p.origin)}</span> <span class="badge">${esc(p.status)}</span> <b>score ${Number(p.score).toFixed(1)}</b></p>
    <p>${esc(p.summary)}</p>
    <h4>Why it scores this</h4>${bars || '<span class="muted">no breakdown yet</span>'}
    <p class="muted">${fmt(mt.owners)} owners, ${fmt(mt.repos)} repos, written ${fmt(mt.occurrences)} times. ${fmt(mt.recent_repos)} repos active in the last 90 days, ${fmt(mt.adopted_repos)} already on a library, ${fmt(mt.mainnet_repos)} on mainnet.</p>
    ${(ev.fix_examples || []).length ? '<h4>Real fixes that touched this code</h4><ul>' + ev.fix_examples.map((f) => '<li><a target="_blank" href="https://github.com/' + esc(f.repo) + '/commit/' + esc(f.sha) + '">' + esc(f.repo) + '</a> <span class="muted">' + esc(f.date) + '</span><br>' + esc(f.message) + '</li>').join('') + '</ul>' : ''}
    ${ev.roles ? '<h4>Pattern roles</h4><pre style="white-space:pre-wrap">' + esc(JSON.stringify(ev.roles, null, 1)) + '</pre>' : ''}
    ${(p.sketch || sm.snippet) ? '<h4>' + (sm.repo ? 'Real example from <a target="_blank" href="https://github.com/' + esc(sm.repo) + '/blob/HEAD/' + esc(sm.path || '') + '#L' + (sm.start || 1) + '">' + esc(sm.repo) + '</a>' : 'Sketch') + '</h4><pre style="overflow:auto;background:var(--bg);padding:10px;border-radius:8px"><code>' + esc(sm.snippet || p.sketch) + '</code></pre>' : ''}
    ${ev.names ? '<h4>Names people reinvent</h4><p>' + ev.names.map((n) => esc(n.name) + ' <span class="muted">(' + n.owners + ')</span>').join(', ') + '</p>' : ''}
    <h4>Notes</h4><div>${rows.map((c) => `<div class="comment"><b>${esc(c.author)}</b> <span class="muted">${esc(String(c.created_at).slice(0,16))}</span><br>${esc(c.body)}</div>`).join('') || '<div class="muted">no notes yet</div>'}</div>
    <p><input type="text" id="who" placeholder="your name" value="${esc(localStorage.getItem('who')||'')}" style="width:100%;margin-bottom:6px"><textarea id="note" placeholder="leave a note on this proposal"></textarea></p>
    <button class="primary" id="send">Add note</button>`;
  $('#send').onclick = async () => {
    const author = $('#who').value || 'anonymous'; localStorage.setItem('who', author);
    const body = $('#note').value.trim(); if (!body) return;
    await fetch('/api/comments', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ target_kind:'proposal', target_id:p.id, author, body }) });
    openProposal(p); load();
  };
}
async function openRepo(name) {
  const rows = await (await fetch('/api/comments?target_kind=repo&target_id=' + encodeURIComponent(name))).json();
  const d = $('#drawer'); d.classList.add('open');
  let r = (state.data.repos || []).find((x) => x.full_name === name);
  if (!r) { try { r = await (await fetch('/api/repo?name=' + encodeURIComponent(name))).json(); } catch (e) { r = {}; } }
  d.innerHTML = `<button onclick="document.querySelector('#drawer').classList.remove('open')">close</button>
    <h3><a href="https://github.com/${esc(name)}" target="_blank">${esc(name)}</a></h3>
    <p>${nets(r)} <span class="muted">${fmt(r.rust_loc)} rust loc · ${fmt(r.pattern_hits)} pattern hits · ★ ${fmt(r.stars)}</span></p>
    ${r.description ? '<p>' + esc(r.description) + '</p>' : ''}${(r.proposals || []).length ? '<h4>Hand-rolls</h4><ul>' + r.proposals.slice(0, 12).map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul>' : ''}
    <h4>Notes</h4><div>${rows.map((c) => `<div class="comment"><b>${esc(c.author)}</b> <span class="muted">${esc(String(c.created_at).slice(0,16))}</span><br>${esc(c.body)}</div>`).join('') || '<div class="muted">no notes yet</div>'}</div>
    <p><input type="text" id="who" placeholder="your name" value="${esc(localStorage.getItem('who')||'')}" style="width:100%;margin-bottom:6px"><textarea id="note" placeholder="leave a note on this repo"></textarea></p>
    <button class="primary" id="send">Add note</button>`;
  $('#send').onclick = async () => {
    const author = $('#who').value || 'anonymous'; localStorage.setItem('who', author);
    const body = $('#note').value.trim(); if (!body) return;
    await fetch('/api/comments', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ target_kind:'repo', target_id:name, author, body }) });
    openRepo(name); load();
  };
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]'); if (tab) { state.tab = tab.dataset.tab; state.filter = ''; state.graphShown = false; location.hash = state.tab; draw(); return; }
  const th = e.target.closest('[data-sort]'); if (th) { const [id, key] = th.dataset.sort.split(':'); const cur = state.sort[id]; state.sort[id] = { key, dir: cur?.key === key ? -cur.dir : -1 }; draw(); return; }
  const row = e.target.closest('tr[data-row]'); if (row) { const [id, i] = row.dataset.row.split(':'); const r = state.rows[id][i]; if (id === 'repos') openRepo(r.full_name); if (id === 'proposals') openProposal(r); if (id === 'needs') openNeed(r); }
});
load(); setInterval(() => $('#auto').checked && load(), 10000);
</script>
